name: Publish homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate homepage
        run: python3 scripts/build.py
      - name: Collect website files
        run: python3 scripts/package_site.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for uploaded artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts"
          for attempt in range(12):
              time.sleep(5)
              request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ['GH_TOKEN'], "Accept": "application/vnd.github+json", "Cache-Control": "no-cache"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  artifacts = json.load(response)['artifacts']
              if any(item['name'] == 'github-pages' and not item['expired'] for item in artifacts):
                  print('Pages artifact is available.')
                  break
          else:
              raise RuntimeError('Pages artifact did not become available in time.')
          PY
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
